<!-- Caju · Faixa de Premiacoes · CSS escopado em #cj-prem -->
<!-- Link padrao: /plataforma/premiacoes · Quando ja estiver nessa pagina: formulario.caju.com.br -->
<!-- Em ambos os casos a UTM de chegada e repassada na URL de destino -->
<div id="cj-prem">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700');
    #cj-prem{display:block;width:100%;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    #cj-prem *,#cj-prem *::before,#cj-prem *::after{box-sizing:border-box}
    #cj-prem .s{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:56px;padding:14px 24px;text-align:center;text-decoration:none;color:#fff;background:#FF7500;transition:background .3s ease,box-shadow .3s ease;cursor:pointer}
    #cj-prem .s::before{content:"";position:absolute;top:0;left:-40%;width:35%;height:100%;pointer-events:none;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.38) 50%,rgba(255,255,255,0) 100%);transform:skewX(-18deg);opacity:0;transition:opacity .2s ease}
    #cj-prem .t{position:relative;font-size:15.5px;font-weight:600;letter-spacing:-.005em;line-height:1.35;text-shadow:0 1px 2px rgba(122,45,0,.30)}
    #cj-prem .t::after{content:"";position:absolute;left:50%;bottom:-3px;width:0;height:1.5px;border-radius:2px;background:rgba(255,255,255,.85);transform:translateX(-50%);transition:width .32s cubic-bezier(.4,0,.2,1)}
    #cj-prem .t strong{font-weight:700}
    #cj-prem .a{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.42);transition:transform .3s cubic-bezier(.4,0,.2,1),background .3s ease,border-color .3s ease}
    #cj-prem .a svg{width:12px;height:12px;display:block;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s ease}
    @keyframes cjPremShine{0%{left:-40%}100%{left:120%}}
    @media (hover:hover) and (pointer:fine){
      #cj-prem .s:hover::before{opacity:1;animation:cjPremShine 1.1s ease forwards}
      #cj-prem .s:hover{background:#F06A00;box-shadow:inset 0 -2px 0 0 rgba(255,255,255,.30)}
      #cj-prem .s:hover .t::after{width:100%}
      #cj-prem .s:hover .a{transform:translateX(5px);background:#fff;border-color:#fff}
      #cj-prem .s:hover .a svg{stroke:#FF7500}
    }
    #cj-prem .s:focus-visible{background:#F06A00;outline:2px solid #fff;outline-offset:-4px}
    #cj-prem .s:focus-visible .t::after{width:100%}
    #cj-prem .s:focus-visible .a{transform:translateX(5px);background:#fff;border-color:#fff}
    #cj-prem .s:focus-visible .a svg{stroke:#FF7500}
    #cj-prem .s:active{background:#F06A00}
    @media (max-width:600px){
      #cj-prem .s{gap:10px;padding:12px 16px;min-height:52px}
      #cj-prem .t{font-size:14px}
      #cj-prem .a{width:22px;height:22px}
    }
    @media (prefers-reduced-motion:reduce){
      #cj-prem .s,#cj-prem .a,#cj-prem .t::after{transition:none}
      #cj-prem .s:hover::before{animation:none;opacity:0}
      #cj-prem .s:hover .a{transform:none}
    }
  </style>
  <a class="s" href="https://www.caju.com.br/plataforma/premiacoes" aria-label="Premiacoes mais Multibeneficios com cartao custo zero e taxa zero. Contrate agora.">
    <span class="t">Premiações + Multibenefícios com cartão <strong>custo zero</strong> e <strong>taxa zero</strong>. Contrate agora!</span>
    <span class="a" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false"><path d="M5 12h13"></path><path d="M12.5 6l6 6-6 6"></path></svg>
    </span>
  </a>
  <script>
  (function(){
    /* ----------------------------------------------------------------
       Destino do clique:
       - fora da pagina de Premiacoes  -> /plataforma/premiacoes
       - ja na pagina de Premiacoes    -> formulario.caju.com.br
       Nos dois casos a UTM de chegada viaja junto. No pulo para o
       formulario vao tambem client_id (cookie _ga), origem e gclid,
       na mesma convencao usada pela LP do CONARH.
    ---------------------------------------------------------------- */
    var URL_PREMIACOES  = 'https://www.caju.com.br/plataforma/premiacoes';
    var URL_FORM        = 'https://formulario.caju.com.br/';
    var PATH_PREMIACOES = '/plataforma/premiacoes';
    var CHAVES_UTM      = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content'];

    var box = document.getElementById('cj-prem');
    if(!box){ return; }
    var link = box.querySelector('a.s');
    if(!link){ return; }

    function utmSalvas(){
      try { return JSON.parse(window.localStorage.getItem('utm') || '{}') || {}; }
      catch(e){ return {}; }
    }
    function clientId(){
      try {
        var m = document.cookie.match(/(?:^|;\s*)_ga=([^;]+)/);
        if(!m){ return ''; }
        var v = decodeURIComponent(m[1]).split('.');
        return v.length >= 4 ? v[v.length-2] + '.' + v[v.length-1] : m[1];
      } catch(e){ return ''; }
    }

    var naUrl  = new URLSearchParams(window.location.search);
    var salvas = utmSalvas();
    var params = new URLSearchParams();

    /* UTM de chegada: a URL atual manda; o que faltar vem do que o site guardou */
    CHAVES_UTM.forEach(function(k){
      var val = naUrl.get(k) || salvas[k];
      if(val){ params.set(k, val); }
    });
    var gclid = naUrl.get('gclid') || salvas.gclid || '';

    /* Normaliza: tira barra final e ignora maiusculas/minusculas */
    var atual = (window.location.pathname || '').toLowerCase().replace(/\/+$/, '');
    var base  = URL_PREMIACOES;

    if(atual === PATH_PREMIACOES){
      base = URL_FORM;
      var cid = clientId();
      var org = (window.location.pathname || '').replace(/^\/+/, '').replace(/\/+$/, '') || 'home';
      if(cid){ params.set('client_id', cid); }
      if(org){ params.set('origem', org); }
    }
    if(gclid){ params.set('gclid', gclid); }

    var qs = params.toString();
    link.setAttribute('href', qs ? base + '?' + qs : base);
  })();
  </script>
</div>
