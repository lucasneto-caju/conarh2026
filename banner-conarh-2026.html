<!--
  ==========================================================================
  Caju · Faixa (banner) de chamada para a LP do CONARH 2026
  --------------------------------------------------------------------------
  Bloco de HTML personalizado para ser colado no Webflow como um Embed,
  posicionado ENTRE o header e a hero da página.

  - Todo o CSS está escopado sob #cj-conarh-strip para não afetar estilos
    globais do Webflow.
  - Cores e tipografia seguem os tokens da LP do CONARH 2026
    (--cj-red #DC0320, --cj-red-600 #C2031C, --cj-orange #FF6A2C, Poppins).
  - A faixa inteira é um único link clicável para /conarh-2026.
  ==========================================================================
-->

<div id="cj-conarh-strip">
  <style>
    /* ===== Fonte ===== */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap');

    /* ===== Tokens (herdados da LP do CONARH) ===== */
    #cj-conarh-strip{
      --cj-red:#DC0320;
      --cj-red-600:#C2031C;
      --cj-red-700:#A80218;
      --cj-orange:#FF6A2C;

      display:block;
      width:100%;
      font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    #cj-conarh-strip *,
    #cj-conarh-strip *::before,
    #cj-conarh-strip *::after{box-sizing:border-box;}

    /* ===== A faixa ===== */
    #cj-conarh-strip .cj-strip{
      position:relative;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      width:100%;
      min-height:56px;
      padding:14px 24px;
      text-align:center;
      text-decoration:none;
      color:#fff;
      /* Mesma lógica de fundo do hero da LP: vermelho com brilho laranja */
      background:
        radial-gradient(130% 200% at 82% -20%, rgba(255,106,44,.38) 0%, rgba(255,106,44,0) 60%),
        linear-gradient(100deg, var(--cj-red) 0%, var(--cj-red-600) 62%, var(--cj-red-700) 100%);
      transition:box-shadow .3s ease, filter .3s ease;
      cursor:pointer;
    }

    /* Brilho que atravessa a faixa no hover */
    #cj-conarh-strip .cj-strip::before{
      content:"";
      position:absolute;
      top:0;
      left:-40%;
      width:35%;
      height:100%;
      pointer-events:none;
      background:linear-gradient(100deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,.20) 50%,
        rgba(255,255,255,0) 100%);
      transform:skewX(-18deg);
      opacity:0;
      transition:opacity .2s ease;
    }
    @media (hover:hover) and (pointer:fine){
      #cj-conarh-strip .cj-strip:hover::before{
        opacity:1;
        animation:cj-strip-shine 1.1s ease forwards;
      }
    }
    #cj-conarh-strip .cj-strip:focus-visible::before{
      opacity:1;
      animation:cj-strip-shine 1.1s ease forwards;
    }
    @keyframes cj-strip-shine{
      0%{left:-40%;}
      100%{left:120%;}
    }

    /* ===== Conteúdo ===== */
    #cj-conarh-strip .cj-strip-ico{
      flex:0 0 auto;
      font-size:16px;
      line-height:1;
      transition:transform .3s ease;
    }
    #cj-conarh-strip .cj-strip-text{
      position:relative;
      font-size:15.5px;
      font-weight:600;
      letter-spacing:-.005em;
      line-height:1.35;
    }
    /* Sublinhado que cresce a partir do centro */
    #cj-conarh-strip .cj-strip-text::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-3px;
      width:0;
      height:1.5px;
      border-radius:2px;
      background:rgba(255,255,255,.85);
      transform:translateX(-50%);
      transition:width .32s cubic-bezier(.4,0,.2,1);
    }
    #cj-conarh-strip .cj-strip-text strong{font-weight:700;}

    /* Seta */
    #cj-conarh-strip .cj-strip-arrow{
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:24px;
      height:24px;
      border-radius:999px;
      background:rgba(255,255,255,.16);
      border:1px solid rgba(255,255,255,.30);
      transition:transform .3s cubic-bezier(.4,0,.2,1), background .3s ease, border-color .3s ease;
    }
    #cj-conarh-strip .cj-strip-arrow svg{
      width:12px;
      height:12px;
      display:block;
      stroke:#fff;
      stroke-width:2.2;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* ===== Hover (só em dispositivos com mouse) / foco ===== */
    @media (hover:hover) and (pointer:fine){
      #cj-conarh-strip .cj-strip:hover{
        filter:brightness(1.07) saturate(1.05);
        box-shadow:inset 0 -2px 0 0 rgba(255,255,255,.22);
      }
      #cj-conarh-strip .cj-strip:hover .cj-strip-text::after{width:100%;}
      #cj-conarh-strip .cj-strip:hover .cj-strip-arrow{
        transform:translateX(5px);
        background:#fff;
        border-color:#fff;
      }
      #cj-conarh-strip .cj-strip:hover .cj-strip-arrow svg{stroke:var(--cj-red);}
      #cj-conarh-strip .cj-strip:hover .cj-strip-ico{transform:scale(1.12) rotate(-6deg);}
    }
    #cj-conarh-strip .cj-strip:focus-visible{
      filter:brightness(1.07) saturate(1.05);
      box-shadow:inset 0 -2px 0 0 rgba(255,255,255,.22);
    }
    #cj-conarh-strip .cj-strip:focus-visible .cj-strip-text::after{width:100%;}
    #cj-conarh-strip .cj-strip:focus-visible .cj-strip-arrow{
      transform:translateX(5px);
      background:#fff;
      border-color:#fff;
    }
    #cj-conarh-strip .cj-strip:focus-visible .cj-strip-arrow svg{stroke:var(--cj-red);}
    #cj-conarh-strip .cj-strip:focus-visible .cj-strip-ico{transform:scale(1.12) rotate(-6deg);}
    #cj-conarh-strip .cj-strip:focus-visible{
      outline:2px solid #fff;
      outline-offset:-4px;
    }
    #cj-conarh-strip .cj-strip:active{filter:brightness(.96);}

    /* ===== Responsivo ===== */
    @media (max-width:600px){
      #cj-conarh-strip .cj-strip{
        gap:10px;
        padding:12px 16px;
        min-height:52px;
      }
      #cj-conarh-strip .cj-strip-text{font-size:14px;}
      #cj-conarh-strip .cj-strip-ico{font-size:15px;}
      #cj-conarh-strip .cj-strip-arrow{width:22px;height:22px;}
    }

    /* ===== Acessibilidade: reduzir movimento ===== */
    @media (prefers-reduced-motion:reduce){
      #cj-conarh-strip .cj-strip,
      #cj-conarh-strip .cj-strip-ico,
      #cj-conarh-strip .cj-strip-arrow,
      #cj-conarh-strip .cj-strip-text::after{transition:none;}
      #cj-conarh-strip .cj-strip:hover::before,
      #cj-conarh-strip .cj-strip:focus-visible::before{animation:none;opacity:0;}
      #cj-conarh-strip .cj-strip:hover .cj-strip-ico{transform:none;}
      #cj-conarh-strip .cj-strip:hover .cj-strip-arrow{transform:none;}
    }
  </style>

  <a class="cj-strip"
     href="https://www.caju.com.br/conarh-2026"
     aria-label="Conheça nossas ofertas especiais para o CONARH 2026">
    <span class="cj-strip-ico" aria-hidden="true">🎉</span>
    <span class="cj-strip-text">Conheça nossas ofertas especiais para o <strong>CONARH 2026</strong></span>
    <span class="cj-strip-arrow" aria-hidden="true">
      <svg viewBox="0 0 24 24" role="presentation" focusable="false">
        <path d="M5 12h13"></path>
        <path d="M12.5 6l6 6-6 6"></path>
      </svg>
    </span>
  </a>
</div>
